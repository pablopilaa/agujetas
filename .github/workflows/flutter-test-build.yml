name: Flutter test build

on:
  pull_request:
    paths:
      - "apps/agujetas_flutter/**"
      - ".github/workflows/flutter-test-build.yml"
      - "firebase/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test and build Android APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: apps/agujetas_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: agujetas-debug-apk
          path: apps/agujetas_flutter/build/app/outputs/flutter-apk/app-debug.apk

      - name: Prepare release keystore
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: flutter build apk --release

      - name: Upload release APK
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: agujetas-release-apk
          path: apps/agujetas_flutter/build/app/outputs/flutter-apk/app-release.apk
